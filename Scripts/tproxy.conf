# Clash MIX TProxy 配置
# 详细参数说明见 Scripts/tproxy.sh

# 强制使用 TPROXY 模式，若设备不支持请改为 0(自动) 或 2(REDIRECT)
PROXY_MODE=1

# 与 Clash 配置中的 tproxy-port 对齐
PROXY_TCP_PORT=7893
PROXY_UDP_PORT=7893

# Clash 以 root 启动，避免代理内核自身流量被重复转发
CORE_USER_GROUP=0:0

# 开启 DNS 劫持，并转发到 Clash 的 DNS 监听端口
DNS_HIJACK_ENABLE=1
DNS_PORT=1053

# 按需开启：拦截 QUIC (UDP/443)
BLOCK_QUIC=0

# 按需开启：绕过中国大陆 IP（需内核支持 ipset）
BYPASS_CN_IP=0

# 默认代理移动网络与 Wi-Fi，不代理热点和 USB 共享
PROXY_MOBILE=1
PROXY_WIFI=1
PROXY_HOTSPOT=0
PROXY_USB=0

# 可选：代理 IPv6（内核支持不足时可改为 0）
PROXY_IPV6=1



# 蓝牙系统栈绕过代理（用于缓解 hal_Bluetooth_lock / qup_uart 长时间唤醒）
# Android AOSP 中 AID_BLUETOOTH 通常为 1002；
# 如厂商ROM改过映射，可改为 auto 自动探测 /system/etc/passwd
BLUETOOTH_BYPASS_ENABLE=1
BLUETOOTH_UID=1002

# OneUI / 三星设备建议：启用按应用绕过，避免 IMS/通话/短信被代理导致 VoLTE 异常
APP_PROXY_ENABLE=1
APP_PROXY_MODE=blacklist
BYPASS_APPS_LIST="0:com.android.phone 0:com.samsung.android.dialer 0:com.samsung.android.incallui 0:com.samsung.android.app.telephonyui 0:com.samsung.android.messaging 0:com.samsung.android.smartcallprovider 0:com.sec.imsservice 0:com.sec.epdg"

# 若仍有待机功耗异常，可尝试：
# 1) 关闭 IPv6 代理：PROXY_IPV6=0
# 2) 关闭 DNS 劫持：DNS_HIJACK_ENABLE=0
