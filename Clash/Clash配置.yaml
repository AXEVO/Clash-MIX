#开始编辑配置时，心中牢记缩进和冒号引号，任何不懂，查看官方wiki：https://wiki.metacubex.one
#修改配置后如果内核不能启动，请查看日志，日志中会告诉你配置第几行写错
#或者使用在线yaml检测器进行检测（https://www.bejson.com/validators/yaml_editor/）
mixed-port: 7890
mode: rule
allow-lan: true
unified-delay: false
tcp-concurrent: true
find-process-mode: always
log-level: warning
#interface-name: tun0  如果需要配合VPN嵌套使用，需使用此功能
ipv6: true
#关掉后可能在部分三星手机上出现dns泄露，volte不可用等问题，目前IPv6可以正常使用，不建议关闭
external-controller: 0.0.0.0:9090
external-ui: WebUI/ZashBoard
#两个面板可选：ZashBoard和MetacubeXD（https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip）
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"


geodata-mode: true
geox-url:
  geoip: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
geo-auto-update: true
geo-update-interval: 48

profile:
  store-selected: true
  store-fake-ip: true

#嗅探器关闭后可能出现连接本机热点的设备无法上网的问题
sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 443, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 853, 8443]
    QUIC:
      ports: [443, 853, 8443]
  skip-domain:
    - "+.push.apple.com"
    - "Mijia Cloud"

#tun必须开启，否则将无法代理流量，如网页打开慢，电报卡连接中，
#可以尝试更换堆栈，同一堆栈在不同设备上体验不同，自行尝试。
#更换为非gvisor堆栈可能导致IPv6出现问题

tun:
  enable: true
  stack: gvisor
  device: Meta
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack: 
    - any:53
    - tcp://any:53
  exclude-uid:
  exclude-package:
    - com.xiaomi.mirror
    - com.xiaomi.mi_connect_service
    - com.samsung.android.messaging
    - com.samsung.android.app.telephonyui
    - com.samsung.android.dialer
    - com.samsung.android.incallui
    - com.samsung.android.smartcallprovider
    - com.samsung.android.intellivoiceservice
    - com.android.settings
    - com.qti.qcc
    - com.sec.epdg
    - com.sec.imsservice
#exclude-package内填写的包名，网络流量不经过tun，相当于黑名单
#但是该应用的dns请求仍会被clash处理，这可能导致问题
#默认添加MIUI镜像服务以及三星电话服务，避免系统功能不可用
#如果想仅代理指定应用，请将exclude-package改为include-package
#然后填上想要走代理的包名，不要忘了英文冒号和缩进。
#目前分流规则已足够完善，白名单可能存在问题，不建议使用
  route-exclude-address-set: 
    - 0.0.0.0/8
    - 127.0.0.0/8
    - 192.168.0.0/16
    - '::/128'
    - '::1/128'
    - fc70::/10
    - fe80::/10

dns:
  enable: true
  ipv6: true
  ipv6-timeout: 300
  enhanced-mode: redir-host
# redir-host / fake-ip 可切换，建议使用redir-host避免出现莫名其妙的bug
#如果删除了user策略组，需要在dns这里也删除，否则内核无法启动
  nameserver-policy:
    'rule-set:userDirect':
      - "https://223.5.5.5/dns-query#中国网站"
      - "https://120.53.53.53/dns-query#中国网站"

    'rule-set:userProxy': 
      - "https://8.8.4.4/dns-query#代理"
      - "https://1.0.0.1/dns-query#代理"

    'geosite:cn,private,googlefcm':
      - "https://223.5.5.5/dns-query#中国网站"
      - "https://120.53.53.53/dns-query#中国网站"
  
  nameserver:
    - "https://8.8.4.4/dns-query#代理"
    - "https://1.0.0.1/dns-query#代理"

  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#中国网站"
    - "https://120.53.53.53/dns-query#中国网站"

#-----------------------------------------------------------------------------
#机场订阅全局设置
pp: &pp
  type: http
  interval: 21600
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 900
    timeout: 3000
    lazy: true
    expected-status: 204

proxy-providers:
#如果想要修改机场名（机场1等），需要全改，建议使用编辑器的查找替换功能
#如果想要删除几个机场，在下面的策略组也要删除对应部分，否则内核无法启动

  机场1:
    <<: *pp
    url: "订阅链接"
    path: ./proxy_providers/机场1.yaml
    override:
      additional-suffix: " <机场1>"
  机场2:
    <<: *pp
    url: "订阅链接"
    path: ./proxy_providers/机场2.yaml
    override:
      additional-suffix: " <机场2>"
  #可无限延伸
    
#------------------------------------------------------------------------------
#代理组全局设置
pg: &pg
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    include-all-providers: true
    url: 'https://www.gstatic.com/generate_204'
pg_us: &pg_us
    filter: "(?i)美|us|unitedstates|united states"
pg_hk: &pg_hk
    filter: "(?i)港|hk|hongkong|hong kong"
#代理组
proxy-groups:

  - name: 代理
    type: select
    proxies:
      - 手动-香港
      - 手动-美国
      - 自动-香港
      - 自动-美国
      - 均衡-香港
      - 均衡-美国
      - 回退-香港
      - 回退-美国
  
  - name: 手动-香港
    <<: [ *pg , *pg_hk ]
    type: select

  - name: 手动-美国
    <<: [ *pg , *pg_us ]
    type: select

  - name: 自动-香港
    <<: [ *pg , *pg_hk ]
    type: url-test

  - name: 自动-美国
    <<: [ *pg , *pg_us ]
    type: url-test

  - name: 均衡-香港
    <<: [ *pg , *pg_hk ]
    type: load-balance
    hideen: true

  - name: 均衡-美国
    <<: [ *pg , *pg_us ]
    type: load-balance
    hideen: true

  - name: 回退-香港
    <<: [ *pg , *pg_hk ]
    type: load-balance
    hideen: true

  - name: 回退-美国
    <<: [ *pg , *pg_us ]
    type: load-balance
    hideen: true

#---------------------自定义分流规则------------------------------
  - name: Google
    <<: [ *pg ]
    type: select
    proxies:
      - 手动-香港
      - 手动-美国
      - 自动-香港
      - 自动-美国
      - 均衡-香港
      - 均衡-美国
      - 回退-香港
      - 回退-美国

  - name: OpenAI
    <<: [ *pg ]
    type: select
    proxies:
      - 手动-香港
      - 手动-美国
      - 自动-香港
      - 自动-美国
      - 均衡-香港
      - 均衡-美国
      - 回退-香港
      - 回退-美国
#----------------------------------------------------------------
  - name: 广告
    type: select
    proxies:
      - REJECT
      - PASS

  - name: 中国网站
    type: select
    proxies:
      - DIRECT
      - REJECT
      - 代理
#-------------------------------------------------------------------
#用户自定义直连/代理规则，文件在模块目录/rule-provider/
#如有需要请参考官方文档写入
#如果想要删除两个自定义规则，需要把上面dns配置内对自定义规则的设置删除，否则内核将无法启动

rule-providers:

  userDirect:
    type: file
    behavior: classical
    path: ./rule_providers/userDirect.yaml

  userProxy:
    type: file
    behavior: classical
    path: ./rule_providers/userProxy.yaml

  秋风广告规则:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_providers/AWAvenue-Ads-Rule-Clash.yaml
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    interval: 86400

rules:

  - RULE-SET,userProxy,代理
  - RULE-SET,userDirect,中国网站
  
  - GEOSITE,googlefcm,DIRECT
  
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT

  - RULE-SET,秋风广告规则,广告
  #- GEOSITE,category-ads-all,广告  #秋风规则足够日用，geodata提供的规则过于冗杂

#--------------------自定义分流规则--------------------
  - GEOSITE,openai,OpenAI
  - GEOSITE,google,Google
#-----------------------------------------------------

  - GEOSITE,CN,中国网站
  - GEOIP,CN,中国网站

  - MATCH,代理
