      url: https://www.gstatic.com/generate_204
      interval: 900
      timeout: 3000
      lazy: true
      expected-status: 204

  机场3:
    type: http
    url: "订阅链接"
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
