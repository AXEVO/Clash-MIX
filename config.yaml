#------------------------------------------------------------------------------
proxy-groups:
  - name: 代理
    type: select
    proxies:
      - 美国节点
      - 机场1
      - 机场2
      - 机场3
      - 机场4
      - 机场5
      - 机场1负载均衡
      - 机场2负载均衡
      - 机场3负载均衡
      - 机场4自动选择
      - 机场5自动回退
      - 自动切换负载均衡
      
  - name: 机场1
    type: select
    use:
      - 机场1
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204

  - name: 机场2
    type: select
    use:
      - 机场2
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204

  - name: 机场3
    type: select
    use:
      - 机场3
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204

  - name: 机场4
    type: select
    use:
      - 机场4
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204

  - name: 机场5
    type: select
    use:
      - 机场5
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204

#------------------------------------------------------------------------------

  - name: 美国节点
    type: select
    include-all: true
    filter: '美国|USA|美國|us|US|United States'
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204

  - name: 机场1负载均衡
    type: load-balance
    use:
      - 机场1
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    filter: '美国|USA|美國|us|US|United States'
    strategy: consistent-hashing

  - name: 机场2负载均衡
    type: load-balance
    use:
      - 机场2
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    filter: '美国|USA|美國|us|US|United States'
    strategy: consistent-hashing

  - name: 机场3负载均衡
    type: load-balance
    use:
      - 机场3
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    filter: '美国|USA|美國|us|US|United States'
    strategy: consistent-hashing

  - name: 机场4自动选择
    type: url-test
    use:
      - 机场4
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    filter: '美国|USA|美國|us|US|United States'
    tolerance: 100

  - name: 机场5自动回退
    type: fallback
    use:
      - 机场5
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    lazy: true
    timeout: 3000
    max-failed-times: 5
    expected-status: 204
    filter: '美国|USA|美國|us|US|United States'

  - name: 自动切换负载均衡
    type: fallback
    proxies:
      - 机场1负载均衡
      - 机场2负载均衡
      - 机场3负载均衡
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    lazy: true
    timeout: 2000
    max-failed-times: 5
    expected-status: 204
#-------------------------------------------------------------------
  - name: 中国网站
    type: select
    proxies:
      - DIRECT
      - REJECT
      - 代理

  - name: 广告
    type: select
    proxies:
      - REJECT
      - PASS
#-------------------------------------------------------------------
#用户自定义规则，文件在模块目录/rule-provider/
#如有需要请参考官方文档写入

rule-providers:

  userDirect:
    type: file
    behavior: classical
    path: ./rule_providers/userDirect.yaml

  userProxy:
    type: file
    behavior: classical
    path: ./rule_providers/userProxy.yaml

  秋风广告规则:
    type: http
    behavior: classical
    format: yaml
    path: ./rule_providers/AWAvenue-Ads-Rule-Clash.yaml
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-classical.yaml"
    interval: 86400

rules:

  - RULE-SET,userProxy,代理
  - RULE-SET,userDirect,中国网站
  
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT

  - RULE-SET,秋风广告规则,广告
  - GEOSITE,category-ads-all,广告

  - GEOSITE,CN,中国网站
  - GEOIP,CN,中国网站

  - MATCH,代理