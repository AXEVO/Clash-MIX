mixed-port: 7890
mode: rule
allow-lan: true
unified-delay: false
tcp-concurrent: true
find-process-mode: strict
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
external-ui: WebUI
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"


geodata-mode: true
geox-url:
  geoip: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 48

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 443, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 853, 8443]
    QUIC:
      ports: [443, 853, 8443]
  skip-domain:
    - "+.push.apple.com"
    - "Mijia Cloud"

tun:
  enable: true
  stack: system
  device: Meta
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack: 
    - any:53
    - tcp://any:53

dns:
  enable: true
  use-hosts: true
  perfer-h3: false
  ipv6-timeout: 300
  listen: 0.0.0.0:1053
  enhanced-mode: redir-host
  # redir-host / fake-ip 可切换，建议使用redir-host避免dns污染和泄露
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "localhost.ptlogin2.qq.com"

  nameserver-policy:
    'rule-set:userDirect':
      - "https://223.5.5.5/dns-query#中国网站"
      - "https://120.53.53.53/dns-query#中国网站"

    'rule-set:userProxy': 
      - "https://8.8.4.4/dns-query#代理"
      - "https://1.0.0.1/dns-query#代理"

    'geosite:cn,private':
      - "https://223.5.5.5/dns-query#中国网站"
      - "https://120.53.53.53/dns-query#中国网站"
  
  nameserver:
    - "https://8.8.4.4/dns-query#代理"
    - "https://1.0.0.1/dns-query#代理"

  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#中国网站"
    - "https://120.53.53.53/dns-query#中国网站"
#------------------------------------------------------------------------------
proxies:
proxy-providers:
  
  机场1:
    type: http
    url: "订阅链接"
    path: ./proxy_providers/机场1.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
      timeout: 3000
      lazy: true
      expected-status: 204

